name: build frpc

on:
  push:
    branches:
      - dev
    paths:
      - 'cmd/frpc/**'
      - 'client/**'
      - 'pkg/**'
      - '.github/workflows/build-frpc.yml'
  pull_request:
    paths:
      - 'cmd/frpc/**'
      - 'client/**'
      - 'pkg/**'
      - '.github/workflows/build-frpc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build frpc (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build frpc
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          suffix="${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            suffix="${suffix}.exe"
          fi
          env CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -tags "frpc,noweb" -o "release/frpc_${suffix}" ./cmd/frpc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frpc-${{ matrix.os }}-${{ matrix.arch }}
          path: release/frpc_*
          retention-days: 7
